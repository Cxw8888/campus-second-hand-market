server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 预留: 生产环境建议开启优雅停机 (P2 未来扩展)
  # shutdown: graceful

spring:
  application:
    name: campus-market
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- 数据源 (敏感配置走环境变量) ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_market}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
    username: ${DB_USERNAME:campus_user}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # ---------------- Redis ----------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  # ---------------- Jackson: Long -> String, GMT+8 ----------------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # ---------------- 文件上传 ----------------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 60MB

  # ---------------- Flyway 版本化迁移 ----------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: true

  # ---------------- 邮件 (毕设降级开关见 app.email.skip) ----------------
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.market.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- Actuator (默认仅 health; prometheus 为可选实现) ----------------
management:
  endpoints:
    web:
      exposure:
        include: health
        # 可选实现: 需要 Prometheus 时追加 prometheus
  endpoint:
    health:
      show-details: when-authorized

# ---------------- SpringDoc / knife4j ----------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true

# =====================================================================
# 业务自定义配置 (app.*)
# =====================================================================
app:
  jwt:
    # 严禁硬编码: 必须由环境变量注入, 长度 >= 32 字节
    #
    # ⚠️ 下面这个默认值【仅用于本地开发 / 答辩演示】。仓库是 Public，本值已公开，
    #    拿到它的人可以自签任意 userId / role=1 的 Token 冒充管理员。
    #    生产环境（application-prod.yml）写的是 `secret: ${JWT_SECRET}`（无默认值）：
    #      · 未注入 JWT_SECRET → 不会退回到本默认值，而是由 JwtUtils.init() 的启动断言
    #        抛出明确异常并中止启动（实测：绑定到字段上的是未替换的字面量 ${JWT_SECRET}）；
    #      · 即使有人手工把 JWT_SECRET 设成本默认值 → prod 下同样被该断言拦下（双保险）。
    secret: ${JWT_SECRET:campus-market-dev-secret-key-please-override-in-env-32bytes}
    expire-hours: ${JWT_EXPIRE_HOURS:2}
    issuer: campus-market

  # CORS: allowedOrigins 走环境变量, 严禁生产使用 *
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allow-credentials: true
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    max-age: 3600

  # 文件存储抽象: local(默认, 毕设推荐) | minio
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-path: ${STORAGE_LOCAL_PATH:./uploads}
      url-prefix: ${STORAGE_URL_PREFIX:/static/uploads}
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:campus-market}

  # 邮件降级开关: 默认 false(安全)。本地开发/答辩若不想依赖 SMTP, 显式设 EMAIL_SKIP=true。
  # ⚠️ skip=true 时验证码不再走 SMTP —— 仅 dev profile 会把验证码放进接口响应体(方便开发)；
  #    非 dev 环境一律不回显，prod 环境还会由 EmailCodeServiceImpl 的启动断言直接拒绝启动。
  email:
    skip: ${EMAIL_SKIP:false}
    code-expire-seconds: 300
    limit-seconds: 60
    fail-lock-threshold: 5
    fail-lock-seconds: 1800
    fail-window-seconds: 3600
    # 校园邮箱后缀允许列表: 严禁硬编码在代码中
    campus-suffixes: ${CAMPUS_EMAIL_SUFFIXES:@stu.edu.cn,@campus.edu.cn}

  security:
    # ---------------- 可信反向代理（批次 6.0.2 · M1） ----------------
    # 只有在"直连对端(RemoteAddr)命中本列表"时，才采信 X-Forwarded-For / X-Real-IP；
    # 否则一律用 request.getRemoteAddr()。
    # 默认【空列表】= 不采信任何转发头 = 最安全（本地开发、直连部署都不需要配）。
    # 部署在 nginx / SLB / 网关之后时，把【代理自己的地址】填进来（支持单个 IP 与 CIDR）：
    #   trusted-proxies:
    #     - 10.0.0.0/8
    #     - 192.168.0.0/16
    #     - 127.0.0.1
    # ⚠️ 修前 IpUtils 无条件采信 XFF，攻击者换个 header 就换一份 IP 维度失败额度；
    #    配上本列表即表示"转发头由可信代理写入"，请按实际网络拓扑填写，不要填过宽。
    # （本批不写 key：字段默认值就是空列表；若写成 ${TRUSTED_PROXIES:} 反而引入空字符串绑定歧义）
    login:
      account-fail-threshold: 5
      account-fail-ttl-seconds: 300
      account-lock-seconds: 900
      ip-fail-threshold: 20
      ip-fail-window-seconds: 300
      ip-lock-seconds: 1800

  # ---------------- 支付回调验签（批次 6.0.2 · S3） ----------------
  # 公开路径 /api/v1/order/pay/callback 必须有签名才受理，算法见 PayCallbackSignService：
  #   sign = HMAC-SHA256(orderNo + "|" + tradeNo + "|" + timestamp, callback-secret) 的十六进制小写
  pay:
    # 空默认值：本地开发不注入也能启动，但此时回调【一律拒绝】(fail-closed)，绝不"没签名也放行"。
    # 本地要联调模拟回调（curl / .http 脚本），显式注入 PAY_CALLBACK_SECRET（>= 32 字节）：
    #   Linux/macOS       : openssl rand -base64 48
    #   Windows PowerShell: [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Max 256 }))
    # 生产环境见 application-prod.yml（无默认值 + 启动断言三连）。
    callback-secret: ${PAY_CALLBACK_SECRET:}
    # 请求 timestamp（毫秒）与服务器时间允许的最大偏差，超过即拒绝（压缩重放窗口）
    timestamp-window-seconds: 300

  order:
    token-ttl-seconds: 300

  # order_no 雪花算法必须配置 workerId
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}

  task:
    # 自定义线程池: 核心 8 (4核×2 IO 密集型), 最大 16, 队列 200, CallerRunsPolicy
    notification:
      core-pool-size: 8
      max-pool-size: 16
      queue-capacity: 200
      keep-alive-seconds: 60
    timeout-cancel:
      minutes: 15
      lock-at-most-for: PT5M
    auto-confirm:
      days: 7
      lock-at-most-for: PT10M
      remind-lock-at-most-for: PT5M
    refund-reject-recover:
      days: 3
      lock-at-most-for: PT10M

# ---------------- 商品搜索优化 (批次 5.4.4) ----------------
# 对应 SearchProperties。两块能力各带独立开关，便于单独关闭而无需回滚代码。
# 注意：本块按批次需求使用顶层 search.*；项目其余业务配置在 app.* 下（见 SearchProperties 类注释）。
search:
  cache:
    # 关闭后每次搜索直达 DB（排查"改了商品却搜不到"时用）
    enabled: true
    # 第 4 章要求：搜索结果缓存 60 秒
    ttl-seconds: 60
    # TTL 随机抖动上限（秒），防缓存雪崩；0 = 不抖动
    ttl-jitter-seconds: 10
  circuit-breaker:
    # 关闭后同步直查 DB，不做 500ms 超时隔离
    enabled: true
    # 第 4 章要求：搜索超时熔断 500ms
    timeout-ms: 500
    # 连续超时次数达阈值即开闸（成功一次即清零）
    failure-threshold: 5
    # 熔断打开后的持续时长：30 秒
    open-millis: 30000

logging:
  level:
    root: INFO
    com.campus.market: DEBUG
  pattern:
    # requestId 由 RequestIdFilter 写入 MDC，异常日志必须带 requestId
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
