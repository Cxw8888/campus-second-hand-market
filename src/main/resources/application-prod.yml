# 生产环境: 所有敏感配置必须由环境变量注入, 严禁硬编码
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:campus_market}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  # 生产环境必须关闭降级开关, 走真实 SMTP
  email:
    skip: false
  cors:
    # 严禁使用 *
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.campus.market: INFO
