# 开发环境: 答辩/联调默认 profile
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:campus_market}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8&rewriteBatchedStatements=true
    username: ${DB_USERNAME:campus_user}
    password: ${DB_PASSWORD:123456}

app:
  # 开发/答辩环境降级: 验证码直接返回响应, 不依赖 SMTP, 避免现场网络问题
  email:
    skip: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.campus.market: DEBUG
    com.campus.market.mapper: DEBUG
    org.springframework.jdbc.core: DEBUG

management:
  health:
    mail:
      enabled: false